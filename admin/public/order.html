<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Order — Occasion Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="mobile-topbar">
  <button class="menu-toggle" aria-label="Open menu">☰</button>
  <div class="brand"><span class="dot"></span> Occasion Sites</div>
</div>
<div class="sidebar-overlay"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Occasion Sites</div>
    <nav>
      <a href="/index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="/customers.html" class="active"><span class="icon">👥</span> Customers</a>
      <a href="/templates.html"><span class="icon">🗂</span> Templates</a>
      <a href="/settings.html"><span class="icon">⚙</span> Settings</a>
    </nav>
    <div class="spacer"></div>
    <div class="sidebar-foot">Occasion Sites Admin</div>
  </aside>
  <main>
    <a class="link" href="#" id="backLink">&larr; Back to customer</a>
    <div class="row between" style="margin-top:8px;">
      <h1 id="pageTitle">Loading…</h1>
      <span class="badge" id="statusBadge"></span>
    </div>
    <div class="sub" id="pageSub"></div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label>Order title</label>
          <input id="oTitle" type="text">
        </div>
        <div>
          <label>Occasion date</label>
          <input id="oDate" type="date">
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn secondary" id="saveTitleBtn">Save title</button>
      </div>
    </div>

    <div id="formSections"></div>

    <div class="row action-bar">
      <button class="btn accent" id="saveBtn">Save changes</button>
      <button class="btn" id="publishBtn">Publish live</button>
      <a class="btn secondary" id="invoiceLink" href="#">Invoices</a>
    </div>
    <div class="sub" id="publishResult" style="margin-top:10px;"></div>
  </main>
</div>
<script src="/app.js"></script>
<script>
const orderId = qs('id');
let order, template;

function fieldControl(field, getValue, setValue) {
  const value = getValue() ?? '';
  if (field.type === 'textarea') {
    const ta = el('textarea', { onchange: () => setValue(ta.value) });
    ta.value = value;
    return ta;
  }
  if (field.type === 'image') {
    const thumb = el('img', {
      class: 'thumb',
      src: value ? `/preview-assets/${orderId}/${value}` : ''
    });
    thumb.style.visibility = value ? 'visible' : 'hidden';
    const fileInput = el('input', {
      type: 'file', accept: 'image/*',
      onchange: async () => {
        const file = fileInput.files[0];
        if (!file) return;
        try {
          const path = await uploadPhoto(orderId, file);
          setValue(path);
          thumb.src = `/preview-assets/${orderId}/${path}`;
          thumb.style.visibility = 'visible';
          toast('Photo uploaded — remember to Save');
        } catch (err) {
          toast(err.message, true);
        }
      }
    });
    return el('div', { class: 'upload-row' }, [thumb, fileInput]);
  }
  const inputType = field.type === 'url' ? 'url' : 'text';
  const input = el('input', { type: inputType, onchange: () => setValue(input.value) });
  input.value = value;
  return input;
}

function renderListField(field) {
  const wrap = el('div', {});
  const items = getPath(order.config, field.key) || [];

  function renderItems() {
    wrap.innerHTML = '';
    items.forEach((item, idx) => {
      const body = field.itemFields.map((sub) => el('div', {}, [
        el('label', {}, sub.label),
        fieldControl(sub, () => item[sub.key], (v) => { item[sub.key] = v; })
      ]));
      wrap.appendChild(el('div', { class: 'list-item' }, [
        el('button', {
          class: 'btn small danger remove', type: 'button',
          onclick: () => { items.splice(idx, 1); renderItems(); }
        }, 'Remove'),
        ...body
      ]));
    });
    setPath(order.config, field.key, items);
  }
  renderItems();

  const addBtn = el('button', {
    class: 'btn small secondary', type: 'button', style: 'margin-top:10px;',
    onclick: () => {
      const blank = {};
      field.itemFields.forEach((sub) => { blank[sub.key] = ''; });
      items.push(blank);
      renderItems();
    }
  }, `+ Add ${field.itemLabel || 'item'}`);

  return el('div', {}, [wrap, addBtn]);
}

function renderForm() {
  const container = document.getElementById('formSections');
  container.innerHTML = '';
  template.schema.sections.forEach((section) => {
    const fieldset = el('fieldset', {}, [el('legend', {}, section.title)]);
    section.fields.forEach((field) => {
      if (field.type === 'list') {
        fieldset.appendChild(el('label', {}, field.label));
        fieldset.appendChild(renderListField(field));
      } else {
        fieldset.appendChild(el('label', {}, field.label + (field.required ? ' *' : '')));
        fieldset.appendChild(fieldControl(
          field,
          () => getPath(order.config, field.key),
          (v) => setPath(order.config, field.key, v)
        ));
      }
    });
    container.appendChild(el('div', { class: 'card' }, fieldset));
  });
}

async function saveConfig() {
  await api('PUT', `/api/orders/${orderId}`, { config: order.config });
  toast('Saved');
}

async function load() {
  order = await api('GET', `/api/orders/${orderId}`);
  const t = await api('GET', `/api/templates/${order.templateId}`);
  template = t;

  document.getElementById('pageTitle').textContent = `${order.orderNumber} — ${order.title}`;
  document.getElementById('pageSub').textContent = `${template.schema.label} · /sites/${order.slug}/`;
  const badge = document.getElementById('statusBadge');
  badge.textContent = order.status;
  badge.className = `badge ${order.status}`;
  document.getElementById('oTitle').value = order.title;
  document.getElementById('oDate').value = order.occasionDate || '';
  document.getElementById('backLink').href = `/customer.html?id=${order.customerId}`;
  document.getElementById('invoiceLink').href = `/invoices.html?orderId=${orderId}`;
  if (order.status === 'published' && order.publicUrl) {
    document.getElementById('publishResult').innerHTML =
      `Live at <a class="link" href="${order.publicUrl}" target="_blank">${order.publicUrl}</a>`;
  }

  renderForm();
}

document.getElementById('saveTitleBtn').addEventListener('click', async () => {
  try {
    await api('PUT', `/api/orders/${orderId}`, {
      title: document.getElementById('oTitle').value,
      occasionDate: document.getElementById('oDate').value
    });
    toast('Title saved');
    load();
  } catch (err) { toast(err.message, true); }
});

document.getElementById('saveBtn').addEventListener('click', () => saveConfig().catch(err => toast(err.message, true)));

document.getElementById('publishBtn').addEventListener('click', async () => {
  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  try {
    await saveConfig();
    const result = await api('POST', `/api/orders/${orderId}/publish`);
    document.getElementById('publishResult').innerHTML = result.published
      ? `Published! Live at <a class="link" href="${result.publicUrl}" target="_blank">${result.publicUrl}</a>`
      : result.message;
    load();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publish live';
  }
});

load().catch(err => toast(err.message, true));
</script>
</body>
</html>
