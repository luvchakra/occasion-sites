<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer — Occasion Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="mobile-topbar">
  <button class="menu-toggle" aria-label="Open menu">☰</button>
  <div class="brand"><span class="dot"></span> Occasion Sites</div>
</div>
<div class="sidebar-overlay"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Occasion Sites</div>
    <nav>
      <a href="/index.html" class="active"><span class="icon">👥</span> Customers</a>
      <a href="/templates.html"><span class="icon">🗂</span> Templates</a>
      <a href="/settings.html"><span class="icon">⚙</span> Settings</a>
    </nav>
    <div class="spacer"></div>
    <div class="sidebar-foot">Occasion Sites Admin</div>
  </aside>
  <main>
    <a class="link" href="/index.html">&larr; All customers</a>
    <h1 id="pageTitle" style="margin-top:8px;">Loading…</h1>
    <div class="sub">Contact info and every order (website) for this customer.</div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label>Customer name</label>
          <input id="cName" type="text">
        </div>
        <div>
          <label>Email</label>
          <input id="cEmail" type="email">
        </div>
        <div>
          <label>Phone</label>
          <input id="cPhone" type="tel">
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn secondary" id="saveContactBtn">Save contact info</button>
      </div>
    </div>

    <h2>New order</h2>
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Order title</label>
          <input id="newTitle" type="text" placeholder="e.g. Kabir & Ananya's Wedding Site">
        </div>
        <div>
          <label>Occasion template</label>
          <div class="row" style="gap:8px; margin-top:0;">
            <select id="newTemplate" style="flex:1;"></select>
            <a class="btn secondary small" id="previewTemplateLink" href="#" target="_blank" style="margin-top:0;">Preview</a>
          </div>
        </div>
        <div>
          <label>Occasion date</label>
          <input id="newOccasionDate" type="date">
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn accent" id="createOrderBtn">Create order</button>
      </div>
    </div>

    <h2>Orders</h2>
    <div class="card">
      <div class="table-wrap">
        <table class="responsive-table">
          <thead>
            <tr><th>Order #</th><th>Title</th><th>Occasion</th><th>Status</th><th>Updated</th><th>Preview</th><th></th></tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>No orders yet — create one above.</div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
<script>
const customerId = qs('id');
let templates = [];

async function loadTemplates() {
  templates = await api('GET', '/api/templates');
  const sel = document.getElementById('newTemplate');
  sel.innerHTML = templates.map(t => `<option value="${t.id}">${t.label}</option>`).join('')
    || '<option disabled>No templates found</option>';
  updatePreviewLink();
  sel.addEventListener('change', updatePreviewLink);
}

function updatePreviewLink() {
  const id = document.getElementById('newTemplate').value;
  const link = document.getElementById('previewTemplateLink');
  link.href = id ? `/preview-template/${id}` : '#';
}

// Same picker used on the New Order form: a template select (scoped to
// this order's occasion) + a Preview button — lets you check how any
// matching template design looks without opening the order itself.
function previewPicker(order) {
  const options = templates.filter((t) => t.occasionType === order.occasionType);
  const sel = el('select', { style: 'min-width:0;' },
    (options.length ? options : templates).map((t) => {
      const opt = el('option', { value: t.id }, t.label);
      if (t.id === order.templateId) opt.selected = true;
      return opt;
    })
  );
  const btn = el('button', {
    class: 'btn small secondary', type: 'button',
    onclick: () => window.open(`/preview-template/${sel.value}`, '_blank')
  }, 'Preview');
  return el('div', { class: 'row', style: 'gap:6px; margin-top:0; flex-wrap:nowrap;' }, [sel, btn]);
}

async function loadOrders() {
  const orders = await api('GET', `/api/orders?customerId=${customerId}`);
  const rows = document.getElementById('orderRows');
  const empty = document.getElementById('emptyState');
  rows.innerHTML = '';
  empty.hidden = orders.length > 0;
  orders
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
    .forEach(o => {
      const tr = el('tr', {}, [
        el('td', { 'data-label': 'Order #' }, o.orderNumber),
        el('td', { 'data-label': 'Title' }, el('a', { class: 'link', href: `/order.html?id=${o.id}` }, o.title)),
        el('td', { 'data-label': 'Occasion' }, o.occasionType),
        el('td', { 'data-label': 'Status' }, el('span', { class: `badge ${o.status}` }, o.status)),
        el('td', { 'data-label': 'Updated' }, o.updatedAt ? new Date(o.updatedAt).toLocaleString() : ''),
        el('td', { 'data-label': 'Preview' }, previewPicker(o)),
        el('td', { class: 'actions' }, [
          el('a', { class: 'btn small secondary', href: `/order.html?id=${o.id}` }, 'Open'),
          ' ',
          el('a', { class: 'btn small secondary', href: `/invoices.html?orderId=${o.id}` }, 'Invoices')
        ])
      ]);
      rows.appendChild(tr);
    });
}

async function loadCustomer() {
  const customer = await api('GET', `/api/customers/${customerId}`);
  document.getElementById('pageTitle').textContent = customer.name;
  document.getElementById('cName').value = customer.name;
  document.getElementById('cEmail').value = customer.email || '';
  document.getElementById('cPhone').value = customer.phone || '';
}

document.getElementById('saveContactBtn').addEventListener('click', async () => {
  try {
    await api('PUT', `/api/customers/${customerId}`, {
      name: document.getElementById('cName').value,
      email: document.getElementById('cEmail').value,
      phone: document.getElementById('cPhone').value
    });
    toast('Contact info saved');
    loadCustomer();
  } catch (err) { toast(err.message, true); }
});

document.getElementById('createOrderBtn').addEventListener('click', async () => {
  const title = document.getElementById('newTitle').value.trim();
  const templateId = document.getElementById('newTemplate').value;
  const occasionDate = document.getElementById('newOccasionDate').value;
  if (!title) return toast('Enter an order title first', true);
  if (!templateId) return toast('No template selected', true);
  try {
    const order = await api('POST', '/api/orders', { customerId, title, templateId, occasionDate });
    location.href = `/order.html?id=${order.id}`;
  } catch (err) {
    toast(err.message, true);
  }
});

Promise.all([loadCustomer(), loadTemplates()]).then(loadOrders).catch(err => toast(err.message, true));
</script>
</body>
</html>
