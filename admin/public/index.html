<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Occasion Sites — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="mobile-topbar">
  <button class="menu-toggle" aria-label="Open menu">☰</button>
  <div class="brand"><span class="dot"></span> Occasion Sites</div>
</div>
<div class="sidebar-overlay"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Occasion Sites</div>
    <nav>
      <a href="/index.html" class="active"><span class="icon">👥</span> Customers</a>
      <a href="/templates.html"><span class="icon">🗂</span> Templates</a>
      <a href="/settings.html"><span class="icon">⚙</span> Settings</a>
    </nav>
    <div class="spacer"></div>
    <div class="sidebar-foot">Occasion Sites Admin</div>
  </aside>
  <main>
    <h1>Customers</h1>
    <div class="sub">Every website you're building for a customer, one row each.</div>

    <div class="card">
      <div class="row between">
        <strong>New customer</strong>
      </div>
      <div class="grid-2">
        <div>
          <label>Customer / couple name</label>
          <input id="newName" type="text" placeholder="e.g. Kabir & Ananya">
        </div>
        <div>
          <label>Occasion template</label>
          <div class="row" style="gap:8px; margin-top:0;">
            <select id="newTemplate" style="flex:1;"></select>
            <a class="btn secondary small" id="previewTemplateLink" href="#" target="_blank" style="margin-top:0;">Preview</a>
          </div>
        </div>
        <div>
          <label>Email (optional)</label>
          <input id="newEmail" type="email">
        </div>
        <div>
          <label>Phone (optional)</label>
          <input id="newPhone" type="tel">
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn accent" id="createBtn">Create customer</button>
      </div>
    </div>

    <h2>All customers</h2>
    <div class="card" id="listCard">
      <div class="table-wrap">
        <table id="customerTable" class="responsive-table">
          <thead>
            <tr><th>Name</th><th>Occasion</th><th>Status</th><th>Updated</th><th>Preview</th><th></th></tr>
          </thead>
          <tbody id="customerRows"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>No customers yet — create your first one above.</div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
<script>
let templates = [];

async function loadTemplates() {
  templates = await api('GET', '/api/templates');
  const sel = document.getElementById('newTemplate');
  sel.innerHTML = templates.map(t => `<option value="${t.id}">${t.label}</option>`).join('')
    || '<option disabled>No templates found</option>';
  updatePreviewLink();
  sel.addEventListener('change', updatePreviewLink);
}

function updatePreviewLink() {
  const id = document.getElementById('newTemplate').value;
  const link = document.getElementById('previewTemplateLink');
  if (id) { link.href = `/preview-template/${id}`; link.removeAttribute('aria-disabled'); }
  else { link.href = '#'; }
}

// A template select (limited to templates matching this order's occasion)
// plus a Preview button — lets you check how any matching template design
// looks before deciding, without opening the order itself.
function previewPicker(c) {
  const options = templates.filter((t) => t.occasionType === c.occasionType);
  const sel = el('select', { style: 'min-width:0;' },
    (options.length ? options : templates).map((t) => {
      const opt = el('option', { value: t.id }, t.label);
      if (t.id === c.templateId) opt.selected = true;
      return opt;
    })
  );
  const btn = el('button', {
    class: 'btn small secondary', type: 'button',
    onclick: () => window.open(`/preview-template/${sel.value}`, '_blank')
  }, 'Preview');
  return el('div', { class: 'row', style: 'gap:6px; margin-top:0; flex-wrap:nowrap;' }, [sel, btn]);
}

async function loadCustomers() {
  const customers = await api('GET', '/api/customers');
  const rows = document.getElementById('customerRows');
  const empty = document.getElementById('emptyState');
  rows.innerHTML = '';
  empty.hidden = customers.length > 0;
  customers
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
    .forEach(c => {
      const tr = el('tr', {}, [
        el('td', { 'data-label': 'Name' }, el('a', { class: 'link', href: `/customer.html?id=${c.id}` }, c.name)),
        el('td', { 'data-label': 'Occasion' }, c.occasionType),
        el('td', { 'data-label': 'Status' }, el('span', { class: `badge ${c.status}` }, c.status)),
        el('td', { 'data-label': 'Updated' }, c.updatedAt ? new Date(c.updatedAt).toLocaleString() : ''),
        el('td', { 'data-label': 'Preview' }, previewPicker(c)),
        el('td', { class: 'actions' }, [
          el('a', { class: 'btn small secondary', href: `/customer.html?id=${c.id}` }, 'Open'),
          ' ',
          el('a', { class: 'btn small secondary', href: `/invoices.html?customerId=${c.id}` }, 'Invoices')
        ])
      ]);
      rows.appendChild(tr);
    });
}

document.getElementById('createBtn').addEventListener('click', async () => {
  const name = document.getElementById('newName').value.trim();
  const templateId = document.getElementById('newTemplate').value;
  const email = document.getElementById('newEmail').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  if (!name) return toast('Enter a customer name first', true);
  if (!templateId) return toast('No template selected', true);
  try {
    const customer = await api('POST', '/api/customers', { name, templateId, email, phone });
    location.href = `/customer.html?id=${customer.id}`;
  } catch (err) {
    toast(err.message, true);
  }
});

loadTemplates().then(loadCustomers).catch(err => toast(err.message, true));
</script>
</body>
</html>
